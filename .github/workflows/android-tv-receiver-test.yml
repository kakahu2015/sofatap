name: Android TV receiver test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/receiver/**'
      - 'android/settings.gradle'
      - 'android/build.gradle'
      - 'android/gradle/**'
      - 'android/gradlew'
      - 'android/gradle.properties'
      - '.github/workflows/android-tv-receiver-test.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test generic Android TV / AOSP receiver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/receiver/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 platforms;android-23 build-tools;36.0.0'

      - name: Build receiver and tests
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :receiver:assembleDebug :receiver:assembleDebugAndroidTest :receiver:testDebugUnitTest

      - name: Run lint
        id: lint
        continue-on-error: true
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :receiver:lintDebug

      - name: Print lint report
        if: always()
        working-directory: android
        run: |
          REPORT="receiver/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            cat "$REPORT"
          fi

      - name: Inspect APK manifest compatibility
        working-directory: android
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APK="receiver/build/outputs/apk/debug/receiver-debug.apk"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/receiver-badging.txt"
          grep -q "sdkVersion:'23'" "$RUNNER_TEMP/receiver-badging.txt"
          if grep -q "uses-feature:.*android.software.leanback.*required='true'" "$RUNNER_TEMP/receiver-badging.txt"; then
            echo 'Leanback must remain optional for vendor/AOSP TV compatibility.' >&2
            exit 1
          fi

      - name: Upload test APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-development-probe
          path: |
            android/receiver/build/outputs/apk/debug/receiver-debug.apk
            android/receiver/build/outputs/apk/androidTest/debug/receiver-debug-androidTest.apk
            android/receiver/build/reports/tests/testDebugUnitTest/
            android/receiver/build/reports/lint-results-debug.html
            android/receiver/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on lint errors
        if: steps.lint.outcome == 'failure'
        run: exit 1
