name: Android TV receiver test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/receiver/**'
      - 'android/settings.gradle'
      - 'android/build.gradle'
      - 'android/gradle/**'
      - 'android/gradlew'
      - 'android/gradle.properties'
      - '.github/workflows/android-tv-receiver-test.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test generic Android TV receiver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/receiver/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Build receiver and tests
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :receiver:assembleDebug :receiver:assembleDebugAndroidTest :receiver:testDebugUnitTest :receiver:lintDebug

      - name: Upload test APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-development-probe
          path: |
            android/receiver/build/outputs/apk/debug/receiver-debug.apk
            android/receiver/build/outputs/apk/androidTest/debug/receiver-debug-androidTest.apk
            android/receiver/build/reports/tests/testDebugUnitTest/
            android/receiver/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14
