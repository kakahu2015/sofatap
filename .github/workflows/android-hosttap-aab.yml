name: Android HostTap Google Play AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode; must be higher than the version already on Google Play
        required: true
        type: number
      version_name:
        description: Android versionName shown to users
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

concurrency:
  group: android-hosttap-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-google-play-aab:
    name: Build signed Google Play AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/hosttap/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Validate release inputs and prepare upload key
        shell: bash
        env:
          HOSTTAP_VERSION_CODE: ${{ inputs.version_code }}
          HOSTTAP_VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_HOSTTAP_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_HOSTTAP_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_HOSTTAP_STORE_PASSWORD: ${{ secrets.ANDROID_HOSTTAP_STORE_PASSWORD }}
          ANDROID_HOSTTAP_KEY_PASSWORD: ${{ secrets.ANDROID_HOSTTAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re

          version_code = os.environ['HOSTTAP_VERSION_CODE']
          version_name = os.environ['HOSTTAP_VERSION_NAME']
          if not re.fullmatch(r'[1-9][0-9]{0,9}', version_code) or int(version_code) > 2100000000:
              raise SystemExit('version_code must be an integer from 1 to 2100000000')
          if not re.fullmatch(r'[0-9A-Za-z][0-9A-Za-z._+-]{0,49}', version_name):
              raise SystemExit('version_name must be 1-50 letters, digits, dots, underscores, plus signs, or hyphens')

          required = (
              'ANDROID_HOSTTAP_UPLOAD_KEYSTORE_BASE64',
              'ANDROID_HOSTTAP_STORE_PASSWORD',
              'ANDROID_HOSTTAP_KEY_PASSWORD',
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Configure required repository Actions secrets: ' + ', '.join(missing))
          PY

          key_store="$RUNNER_TEMP/hosttap-upload-key.jks"
          printf '%s' "$ANDROID_HOSTTAP_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$key_store"
          chmod 600 "$key_store"
          keytool -list -keystore "$key_store" -alias 'play' \
            -storepass "$ANDROID_HOSTTAP_STORE_PASSWORD" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$key_store" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/hosttap-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_HOSTTAP_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: play
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_HOSTTAP_KEY_PASSWORD }}
          HOSTTAP_VERSION_CODE: ${{ inputs.version_code }}
          HOSTTAP_VERSION_NAME: ${{ inputs.version_name }}
        run: >-
          ./gradlew --no-daemon --stacktrace :hosttap:bundleRelease
          -PhosttapVersionCode="$HOSTTAP_VERSION_CODE"
          -PhosttapVersionName="$HOSTTAP_VERSION_NAME"

      - name: Verify and stage signed AAB
        shell: bash
        env:
          HOSTTAP_VERSION_CODE: ${{ inputs.version_code }}
          HOSTTAP_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find android/hosttap/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print)
          if [[ "${#bundles[@]}" -ne 1 ]]; then
            echo "Expected exactly one release AAB, found ${#bundles[@]}." >&2
            exit 1
          fi
          if ! unzip -Z1 "${bundles[0]}" | grep -Eiq '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            echo "The release AAB does not contain a JAR signing block." >&2
            exit 1
          fi
          jarsigner -verify "${bundles[0]}" >/dev/null

          mkdir -p artifacts/android
          artifact="artifacts/android/HostTap-${HOSTTAP_VERSION_NAME}-${HOSTTAP_VERSION_CODE}.aab"
          cp "${bundles[0]}" "$artifact"
          sha256sum "$artifact" | tee artifacts/android/SHA256SUMS

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v7
        with:
          name: HostTap-Google-Play-AAB-${{ github.run_number }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary upload key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/hosttap-upload-key.jks"
