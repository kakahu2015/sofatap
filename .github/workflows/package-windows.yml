name: Package Windows distribution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'host/**'
      - 'desktop/windows/**'
      - 'scripts/build-windows.sh'
      - 'scripts/windows/**'
      - 'docs/WINDOWS-START.md'
      - 'updates/desktop-version.txt'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - 'tests/windows_packaging.py'
      - '.github/workflows/package-windows.yml'

permissions:
  contents: read

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Windows x64 distributable package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Read package version
        id: metadata
        shell: bash
        run: |
          version="$(tr -d '\r\n' < updates/desktop-version.txt)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify Windows packaging provenance and licenses
        run: python3 tests/windows_packaging.py

      - name: Build distributable Windows package
        shell: bash
        run: SOFATAP_DOTNET="$(command -v dotnet)" bash scripts/build-windows.sh

      - name: Verify distributable archive
        shell: bash
        run: |
          test -s artifacts/SofaTap-Windows-x64.zip
          test -s artifacts/SofaTap-Windows-x64.zip.sha256
          (cd artifacts && shasum -a 256 -c SofaTap-Windows-x64.zip.sha256)
          python3 - <<'PY'
          import json
          from pathlib import Path
          import zipfile

          archive = Path('artifacts/SofaTap-Windows-x64.zip')
          expected_version = Path('updates/desktop-version.txt').read_text(encoding='utf-8').strip()
          root = 'SofaTap-Windows-x64/'
          required = {
              root + 'SofaTap.exe',
              root + 'SofaTapHost.exe',
              root + 'LICENSE',
              root + 'THIRD-PARTY-NOTICES.md',
              root + '开始使用.md',
              root + 'Start-SofaTap.cmd',
              root + 'sofatap-package.json',
              root + 'licenses/RESOLVED-PACKAGES.txt',
          }
          with zipfile.ZipFile(archive) as package:
              names = set(package.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('Missing release files: ' + ', '.join(missing))
              manifest = json.loads(package.read(root + 'sofatap-package.json'))
          if manifest.get('Product') != 'com.chekusu.sofatap.receiver.windows':
              raise SystemExit('Unexpected Windows package product id')
          if manifest.get('Version') != expected_version:
              raise SystemExit(f"Package version {manifest.get('Version')!r} != {expected_version!r}")
          if manifest.get('Architecture') != 'x64':
              raise SystemExit('Unexpected Windows package architecture')
          print(f'Validated Windows distribution {expected_version} ({archive.stat().st_size} bytes)')
          PY

      - name: Upload Windows distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SofaTap-Windows-x64-${{ steps.metadata.outputs.version }}
          path: |
            artifacts/SofaTap-Windows-x64.zip
            artifacts/SofaTap-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
