name: Package Windows Store MSIX

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-windows-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Windows Store x64 + arm64 MSIX upload
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Create Partner Center identity file
        shell: pwsh
        run: |
          $identityJson = @'
          {
            "identityName": "GUIHUIHU.HostTap",
            "publisher": "CN=A4BEB966-7421-4DE4-83EB-CB29EEC65FCE",
            "publisherDisplayName": "GUIHUI HU",
            "displayName": "HostTap",
            "version": "1.0.2.0"
          }
          '@
          $identityJson | Set-Content .\packaging\windows-store\store-identity.json -Encoding UTF8

      - name: Verify .NET 10 SDK
        shell: pwsh
        run: |
          $sdks = dotnet --list-sdks
          if (-not ($sdks -match '^10\.')) {
            throw '.NET 10 SDK is not installed or not available in PATH.'
          }

      - name: Locate Windows SDK packaging tools
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1

          if (-not $makeappx) {
            winget install --id Microsoft.WindowsSDK.10.0.28000 --exact --source winget --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $makeappx = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue |
              Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
              Select-Object -First 1
          }

          if (-not $makeappx) {
            throw 'makeappx.exe was not found after checking the installed Windows SDK.'
          }

          "SOFATAP_WINDOWS_SDK_BIN=$($makeappx.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Windows SDK tools from $($makeappx.DirectoryName)"

      - name: Build Microsoft Store package
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-msix.ps1

      - name: Verify Partner Center upload package
        shell: pwsh
        run: |
          $upload = '.\artifacts\msix\packages\HostTap-Remote.msixupload'
          $shaFile = "$upload.sha256"

          if (-not (Test-Path -LiteralPath $upload -PathType Leaf)) {
            throw "Missing Partner Center upload package: $upload"
          }
          if (-not (Test-Path -LiteralPath $shaFile -PathType Leaf)) {
            throw "Missing SHA-256 file: $shaFile"
          }

          $expected = ((Get-Content -LiteralPath $shaFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $upload -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SHA-256 mismatch: expected $expected, got $actual"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $upload))
          try {
            $bundle = $archive.Entries | Where-Object { $_.FullName -eq 'HostTap-Remote.msixbundle' }
            if (-not $bundle) {
              throw 'The .msixupload does not contain HostTap-Remote.msixbundle.'
            }
          }
          finally {
            $archive.Dispose()
          }

          Get-Item -LiteralPath $upload | Format-List FullName,Length,LastWriteTime
          Get-Content -LiteralPath $shaFile

      - name: Upload Partner Center package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HostTap-Store-1.0.2.0
          path: |
            artifacts/msix/packages/HostTap-Remote.msixupload
            artifacts/msix/packages/HostTap-Remote.msixupload.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
