plugins { id 'com.android.application' }

def releaseSigning = [
    storeFile: System.getenv('ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD')
]
def releaseSigningConfigured = releaseSigning.values().every { value -> value != null && !value.isBlank() }
def hostTapVersionCode = (project.findProperty('hosttapVersionCode') ?: '1').toString().toInteger()
def hostTapVersionName = (project.findProperty('hosttapVersionName') ?: '1.0.0').toString()

android {
    namespace 'com.chekusu.hosttap'
    compileSdk 36

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    defaultConfig {
        // Google Play package identity for this distribution.
        applicationId 'org.kakahu.hosttap'
        minSdk 26
        targetSdk 36
        versionCode hostTapVersionCode
        versionName hostTapVersionName
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.12.0'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.zxing:core:3.5.3'
}
